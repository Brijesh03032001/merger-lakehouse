resources:
  jobs:
    fmcg_prepare_storage:
      name: "[${bundle.target}] FMCG Lakehouse - Prepare Storage"
      description: Creates the catalog, schemas, and managed landing volume.
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../consolidated_pipeline/1_setup/setup_catalogs.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}

    fmcg_initial_load:
      name: "[${bundle.target}] FMCG Lakehouse - Initial Load"
      description: Creates schemas and runs the complete historical lakehouse load.
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
        - name: start_date
          default: ${var.date_start}
        - name: end_date
          default: ${var.date_end}
      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../consolidated_pipeline/1_setup/setup_catalogs.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: create_date_dimension
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../consolidated_pipeline/1_setup/dim_date_table_creation.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"

        - task_key: load_customers
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../consolidated_pipeline/2_dimension_data_processing/1_customer_data_processing.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: customers
              source_root: "{{job.parameters.source_root}}"

        - task_key: load_products
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../consolidated_pipeline/2_dimension_data_processing/2_products_data_processing.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: products
              source_root: "{{job.parameters.source_root}}"

        - task_key: load_pricing
          depends_on:
            - task_key: load_products
          notebook_task:
            notebook_path: ../consolidated_pipeline/2_dimension_data_processing/3_pricing_data_processing.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: gross_price
              source_root: "{{job.parameters.source_root}}"

        - task_key: load_historical_orders
          depends_on:
            - task_key: create_date_dimension
            - task_key: load_customers
            - task_key: load_pricing
          notebook_task:
            notebook_path: ../consolidated_pipeline/3_fact_data_processing/1_full_load_fact.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: orders
              source_root: "{{job.parameters.source_root}}"

    fmcg_daily_incremental:
      name: "[${bundle.target}] FMCG Lakehouse - Daily Incremental"
      description: Refreshes dimensions and ingests the daily order landing zone.
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: ${var.incremental_schedule_status}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
      tasks:
        - task_key: refresh_customers
          notebook_task:
            notebook_path: ../consolidated_pipeline/2_dimension_data_processing/1_customer_data_processing.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: customers
              source_root: "{{job.parameters.source_root}}"

        - task_key: refresh_products
          notebook_task:
            notebook_path: ../consolidated_pipeline/2_dimension_data_processing/2_products_data_processing.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: products
              source_root: "{{job.parameters.source_root}}"

        - task_key: refresh_pricing
          depends_on:
            - task_key: refresh_products
          notebook_task:
            notebook_path: ../consolidated_pipeline/2_dimension_data_processing/3_pricing_data_processing.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: gross_price
              source_root: "{{job.parameters.source_root}}"

        - task_key: ingest_incremental_orders
          depends_on:
            - task_key: refresh_customers
            - task_key: refresh_pricing
          notebook_task:
            notebook_path: ../consolidated_pipeline/3_fact_data_processing/2_incremental_load_fact.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: orders
              source_root: "{{job.parameters.source_root}}"

    fmcg_demo_seed_parent:
      name: "[${bundle.target}] FMCG Lakehouse - Seed Parent Demo Masters"
      description: >-
        Portfolio demo only. Loads a synthetic parent company's customers, products and monthly
        orders into the shared Gold tables so the acquired company has someone to be merged with.
        Production already has these tables. Run before fmcg_initial_load.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
      tasks:
        - task_key: seed_parent_masters
          notebook_task:
            notebook_path: ../consolidated_pipeline/1_setup/seed_parent_demo_masters.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              source_root: "{{job.parameters.source_root}}"

    fmcg_entity_resolution:
      name: "[${bundle.target}] FMCG Lakehouse - Entity Resolution and Unified Reports"
      description: >-
        Matches acquired-company customers and products to the parent company's, queues uncertain
        pairs for review, then publishes the unified and point-in-time reporting views.
        Run after the dimensions are loaded. Claude adjudication is off unless llm_enabled=true.
      max_concurrent_runs: 1
      email_notifications:
        on_failure: ${var.alert_emails}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: merger_date
          default: ${var.merger_date}
        - name: llm_enabled
          default: "false"
        - name: llm_model
          default: claude-opus-5-5
        - name: secret_scope
          default: ""
      tasks:
        - task_key: resolve_customers
          notebook_task:
            notebook_path: ../consolidated_pipeline/4_entity_resolution/1_resolve_entities.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              entity: customers
              llm_enabled: "{{job.parameters.llm_enabled}}"
              llm_model: "{{job.parameters.llm_model}}"
              secret_scope: "{{job.parameters.secret_scope}}"

        - task_key: resolve_products
          notebook_task:
            notebook_path: ../consolidated_pipeline/4_entity_resolution/1_resolve_entities.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              entity: products
              llm_enabled: "{{job.parameters.llm_enabled}}"
              llm_model: "{{job.parameters.llm_model}}"
              secret_scope: "{{job.parameters.secret_scope}}"

        - task_key: build_reporting_views
          depends_on:
            - task_key: resolve_customers
            - task_key: resolve_products
          notebook_task:
            notebook_path: ../consolidated_pipeline/6_reporting/1_reporting_views.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              merger_date: "{{job.parameters.merger_date}}"

    fmcg_orders_autoloader:
      name: "[${bundle.target}] FMCG Lakehouse - Orders via Auto Loader"
      description: >-
        Exactly-once daily order ingestion with Auto Loader, followed by the data-health gate.
        Replaces fmcg_daily_incremental: pause that job before unpausing this one.
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: ${var.autoloader_schedule_status}
      email_notifications:
        on_failure: ${var.alert_emails}
        on_duration_warning_threshold_exceeded: ${var.alert_emails}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
        - name: max_order_qty
          default: ${var.max_order_qty}
        - name: min_valid_rate
          default: ${var.min_valid_rate}
        - name: max_data_age_hours
          default: ${var.max_data_age_hours}
        - name: bronze_tables
          default: orders,orders_raw,orders_kafka
      tasks:
        - task_key: ingest_orders
          # Auto Loader stops once when the source adds a column; the retry restarts it on the wider schema.
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          notebook_task:
            notebook_path: ../consolidated_pipeline/3_fact_data_processing/3_autoloader_orders.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              data_source: orders
              source_root: "{{job.parameters.source_root}}"
              max_order_qty: "{{job.parameters.max_order_qty}}"

        - task_key: quality_gate
          depends_on:
            - task_key: ingest_orders
          notebook_task:
            notebook_path: ../consolidated_pipeline/5_quality/1_run_quality_checks.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              bronze_table: "{{job.parameters.bronze_tables}}"
              max_order_qty: "{{job.parameters.max_order_qty}}"
              min_valid_rate: "{{job.parameters.min_valid_rate}}"
              max_age_hours: "{{job.parameters.max_data_age_hours}}"

    fmcg_backfill_orders:
      name: "[${bundle.target}] FMCG Lakehouse - Backfill Orders"
      description: >-
        Rebuilds Silver, Gold and the shared monthly fact for an order-date range from Bronze,
        applying the current quality rules. Re-running with the same range converges.
      max_concurrent_runs: 1
      email_notifications:
        on_failure: ${var.alert_emails}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: start_date
          default: ${var.date_start}
        - name: end_date
          default: ${var.date_end}
        - name: bronze_table
          default: orders_raw
        - name: max_order_qty
          default: ${var.max_order_qty}
        - name: bronze_tables
          default: orders,orders_raw,orders_kafka
        - name: min_valid_rate
          default: ${var.min_valid_rate}
        - name: max_data_age_hours
          default: ${var.max_data_age_hours}
      tasks:
        - task_key: backfill_range
          notebook_task:
            notebook_path: ../consolidated_pipeline/3_fact_data_processing/4_backfill_orders.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              bronze_table: "{{job.parameters.bronze_table}}"
              max_order_qty: "{{job.parameters.max_order_qty}}"

        - task_key: quality_gate
          depends_on:
            - task_key: backfill_range
          notebook_task:
            notebook_path: ../consolidated_pipeline/5_quality/1_run_quality_checks.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              bronze_table: "{{job.parameters.bronze_tables}}"
              max_order_qty: "{{job.parameters.max_order_qty}}"
              min_valid_rate: "{{job.parameters.min_valid_rate}}"
              max_age_hours: "{{job.parameters.max_data_age_hours}}"

    fmcg_data_health:
      name: "[${bundle.target}] FMCG Lakehouse - Data Health Check"
      description: >-
        Runs after the daily load. Fails (and notifies) when Bronze, Silver and Gold disagree,
        SCD2 history is inconsistent, the valid-row rate drops, or no new data has arrived in time.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: ${var.health_schedule_status}
      email_notifications:
        on_failure: ${var.alert_emails}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: max_order_qty
          default: ${var.max_order_qty}
        - name: min_valid_rate
          default: ${var.min_valid_rate}
        - name: max_data_age_hours
          default: ${var.max_data_age_hours}
        - name: bronze_tables
          default: orders,orders_raw,orders_kafka
      tasks:
        - task_key: quality_gate
          notebook_task:
            notebook_path: ../consolidated_pipeline/5_quality/1_run_quality_checks.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              bronze_table: "{{job.parameters.bronze_tables}}"
              max_order_qty: "{{job.parameters.max_order_qty}}"
              min_valid_rate: "{{job.parameters.min_valid_rate}}"
              max_age_hours: "{{job.parameters.max_data_age_hours}}"

    fmcg_orders_kafka:
      name: "[${bundle.target}] FMCG Lakehouse - Orders from Kafka"
      description: >-
        Drains the order topic into Bronze, Silver and Gold exactly once per message. Each run reads from the
        last checkpoint and stops, so a schedule gives near-real-time freshness without a cluster running all day.
        Fails fast until kafka_bootstrap_servers is set. Do not let it overlap the daily load windows.
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 5/15 * * * ?"
        timezone_id: UTC
        pause_status: ${var.kafka_schedule_status}
      email_notifications:
        on_failure: ${var.alert_emails}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_root
          default: ${var.source_root}
        - name: bootstrap_servers
          default: ${var.kafka_bootstrap_servers}
        - name: topic
          default: ${var.kafka_topic}
        - name: security_protocol
          default: ${var.kafka_security_protocol}
        - name: secret_scope
          default: ${var.kafka_secret_scope}
        - name: max_order_qty
          default: ${var.max_order_qty}
        - name: max_offsets_per_trigger
          default: "500000"
      tasks:
        - task_key: ingest_orders_from_kafka
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          notebook_task:
            notebook_path: ../consolidated_pipeline/3_fact_data_processing/5_kafka_orders.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              source_root: "{{job.parameters.source_root}}"
              bootstrap_servers: "{{job.parameters.bootstrap_servers}}"
              topic: "{{job.parameters.topic}}"
              security_protocol: "{{job.parameters.security_protocol}}"
              secret_scope: "{{job.parameters.secret_scope}}"
              max_order_qty: "{{job.parameters.max_order_qty}}"
              max_offsets_per_trigger: "{{job.parameters.max_offsets_per_trigger}}"
              trigger: availableNow
